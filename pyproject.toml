[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentrylink"
version = "0.1.0"
description = "Privacy-preserving cross-organization intelligence layer: federated learning + secure multi-party computation"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "cryptography>=42.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["sentrylink*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
